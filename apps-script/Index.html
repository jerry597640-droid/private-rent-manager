<!DOCTYPE html><html lang="zh-Hant"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f3f6fa;color:#16263f}header{background:#142b4d;color:white;padding:24px 18px 38px}h1{font-size:24px;margin:0 0 7px}main{max-width:780px;margin:-18px auto 30px;padding:0 14px}.card{background:white;border-radius:17px;padding:20px;margin-bottom:15px;box-shadow:0 6px 24px #122b4812}label{display:block;font-weight:700;margin:13px 0 7px}select,input,textarea{width:100%;border:1px solid #b8c6d6;border-radius:10px;padding:13px;font-size:16px;background:white}input:focus,select:focus,textarea:focus{outline:2px solid #82b8ec}button{width:100%;background:#1768b5;border:0;color:white;font-size:16px;font-weight:700;padding:15px;border-radius:11px;margin-top:15px}button:disabled{opacity:.55}small,.muted{color:#65758b}header small{color:#c3d7ef}.row{display:grid;grid-template-columns:1fr 1fr;gap:13px}.status{padding:12px;border-radius:9px;background:#eef5fc;margin-top:12px}.check{display:flex;gap:12px;align-items:center;margin-top:18px}.check input{width:23px;height:23px}.sum{font-weight:700;font-size:18px}@media(max-width:550px){.row{grid-template-columns:1fr}.card{padding:17px}} </style></head><body><header><h1>每月收租管理</h1><small id="mode">私人 Google Sheets 收款工作台</small></header><main><section class="card"><label for="month">收租月份</label><select id="month"></select><label for="item">收租物件／類型</label><select id="item"></select><div class="row"><div><label for="date">實際入帳日</label><input id="date" type="date"></div><div><label for="amount">實收金額（元）</label><input id="amount" type="number" min="0" step="0.01"></div></div><label class="check"><input id="paid" type="checkbox">確認已收款</label><label for="note">備註</label><textarea id="note" rows="2" maxlength="500"></textarea><button id="save" disabled>儲存至 Google Sheets</button><button id="reload" type="button">重新讀取</button><div class="status" id="status" role="status">正在讀取月份…</div></section><section class="card"><div class="sum" id="summary">當月收款概況</div><p class="muted">僅讀取已授權的試算表。儲存前請確認月份、物件與金額。</p></section></main><script>const $=id=>document.getElementById(id);
let rows=[],busy=true,loadedMonth='',request=0;
function status(s){$('status').textContent=s}
function controls(disabled){
  busy=disabled;
  ['month','item','date','amount','paid','note'].forEach(id=>$(id).disabled=disabled);
  $('save').disabled=disabled||!rows.length;
}
function fail(e){rows=[];loadedMonth='';$('item').replaceChildren();render();controls(false);status('操作失敗：'+(e&&e.message||e)+'。請重新讀取。')}
function loadMonths(){
  controls(true);
  google.script.run.withSuccessHandler(ctx=>{
    $('mode').textContent=ctx.testMode?'測試副本｜所有儲存僅供驗收':'正式收租工作台';
    $('month').replaceChildren();
    ctx.months.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;$('month').append(o)});
    if(!ctx.months.length){fail('找不到月份分頁');return}
    $('month').value=ctx.months[ctx.months.length-1];loadRows();
  }).withFailureHandler(fail).getContext();
}
function loadRows(message){
  const month=$('month').value,seq=++request;
  const selectedRow=loadedMonth===month?rows[Number($('item').value)]?.row:null;
  rows=[];loadedMonth='';controls(true);render();status('讀取收款資料…');
  google.script.run.withSuccessHandler(data=>{
    if(seq!==request||month!==$('month').value)return;
    rows=data;loadedMonth=month;$('item').replaceChildren();
    rows.forEach((r,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=r.property+'／'+r.type;$('item').append(o)});
    const selectedIndex=rows.findIndex(r=>r.row===selectedRow);
    if(selectedIndex>=0)$('item').value=String(selectedIndex);
    controls(false);render();status(message||(rows.length?'資料已載入，請選擇物件。':'這個月份沒有收租資料。'));
  }).withFailureHandler(e=>{if(seq===request)fail(e)}).getRows(month);
}
function render(){
  const r=rows[Number($('item').value)];
  $('save').disabled=!r||busy;
  $('date').value=r?r.date||'':'';
  $('amount').value=r?r.amount??'':'';
  $('paid').checked=r?!!r.paid:false;
  $('note').value=r?r.note||'':'';
  const paid=rows.filter(x=>x.paid).length,total=rows.reduce((n,x)=>n+(Number(x.amount)||0),0);
  $('summary').textContent=rows.length?'已收 '+paid+' / '+rows.length+' 筆｜實收 '+total.toLocaleString('zh-TW')+' 元':'本月無資料';
}
$('month').addEventListener('change',()=>loadRows());
$('item').addEventListener('change',render);
$('reload').addEventListener('click',()=>{if(!busy)loadMonths()});
$('save').addEventListener('click',()=>{
  const r=rows[Number($('item').value)];
  if(!r||busy||loadedMonth!==$('month').value)return;
  if(!$('amount').reportValidity()||!$('date').reportValidity())return;
  const p={month:loadedMonth,row:r.row,property:r.property,type:r.type,version:r.version,date:$('date').value,amount:$('amount').value,paid:$('paid').checked,note:$('note').value};
  if(p.paid&&(!p.date||!(Number(p.amount)>0))){status('已收款必須填寫金額及入帳日');return}
  if(!confirm('確認儲存 '+p.month+' '+p.property+'／'+p.type+' 的收款資料？'))return;
  controls(true);status('正在儲存…');
  google.script.run.withSuccessHandler(()=>loadRows('儲存成功，已重新讀取 Google Sheets。')).withFailureHandler(fail).saveRent(p);
});
loadMonths();</script></body></html>
