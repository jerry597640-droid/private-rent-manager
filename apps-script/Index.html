<!DOCTYPE html><html lang="zh-Hant"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f3f6fa;color:#16263f}header{background:#142b4d;color:white;padding:24px 18px 38px}h1{font-size:24px;margin:0 0 7px}main{max-width:780px;margin:-18px auto 30px;padding:0 14px}.card{background:white;border-radius:17px;padding:20px;margin-bottom:15px;box-shadow:0 6px 24px #122b4812}label{display:block;font-weight:700;margin:13px 0 7px}select,input,textarea{width:100%;border:1px solid #b8c6d6;border-radius:10px;padding:13px;font-size:16px;background:white}input:focus,select:focus,textarea:focus{outline:2px solid #82b8ec}button{width:100%;background:#1768b5;border:0;color:white;font-size:16px;font-weight:700;padding:15px;border-radius:11px;margin-top:15px}button:disabled{opacity:.55}small,.muted{color:#65758b}header small{color:#c3d7ef}.row{display:grid;grid-template-columns:1fr 1fr;gap:13px}.status{padding:12px;border-radius:9px;background:#eef5fc;margin-top:12px}.check{display:flex;gap:12px;align-items:center;margin-top:18px}.check input{width:23px;height:23px}.sum{font-weight:700;font-size:18px}@media(max-width:550px){.row{grid-template-columns:1fr}.card{padding:17px}} </style></head><body><header><h1>每月收租管理</h1><small>私人 Google Sheets 收款工作台</small></header><main><section class="card"><label for="month">收租月份</label><select id="month"></select><label for="item">收租物件／類型</label><select id="item"></select><div class="row"><div><label for="date">實際入帳日</label><input id="date" type="date"></div><div><label for="amount">實收金額（元）</label><input id="amount" type="number" min="0" step="1"></div></div><label class="check"><input id="paid" type="checkbox">確認已收款</label><label for="note">備註</label><textarea id="note" rows="2" maxlength="500"></textarea><button id="save" disabled>儲存至 Google Sheets</button><div class="status" id="status" role="status">正在讀取月份…</div></section><section class="card"><div class="sum" id="summary">當月收款概況</div><p class="muted">僅讀取已授權的試算表。儲存前請確認月份、物件與金額。</p></section></main><script>const $=id=>document.getElementById(id);let rows=[],busy=false;function status(s){$('status').textContent=s}function fail(e){busy=false;$('save').disabled=!rows.length;status('操作失敗：'+(e&&e.message||e))}function loadMonths(){google.script.run.withSuccessHandler(ms=>{if(!ms.length){status('找不到月份分頁');return}$('month').innerHTML=ms.map(m=>'<option>'+m+'</option>').join('');$('month').value=ms[ms.length-1];loadRows()}).withFailureHandler(fail).getMonths()}function loadRows(){busy=true;$('save').disabled=true;status('讀取收款資料…');google.script.run.withSuccessHandler(data=>{rows=data;const sel=$('item');sel.replaceChildren();rows.forEach((r,i)=>{let o=document.createElement('option');o.value=String(i);o.textContent=r.property+'／'+r.type;sel.append(o)});busy=false;render();status(rows.length?'資料已載入，請選擇物件。':'這個月份沒有收租資料。')}).withFailureHandler(fail).getRows($('month').value)}function render(){const r=rows[Number($('item').value)];$('save').disabled=!r||busy;if(!r){$('date').value='';$('amount').value='';$('paid').checked=false;$('note').value='';$('summary').textContent='本月無資料';return}$('date').value=r.date||'';$('amount').value=r.amount??'';$('paid').checked=!!r.paid;$('note').value=r.note||'';const paid=rows.filter(x=>x.paid).length,total=rows.reduce((n,x)=>n+(x.paid?Number(x.amount)||0:0),0);$('summary').textContent='已收 '+paid+' / '+rows.length+' 筆｜實收 '+total.toLocaleString('zh-TW')+' 元'}$('month').addEventListener('change',loadRows);$('item').addEventListener('change',render);$('save').addEventListener('click',()=>{const r=rows[Number($('item').value)];if(!r||busy)return;const p={month:$('month').value,row:r.row,property:r.property,type:r.type,date:$('date').value,amount:$('amount').value,paid:$('paid').checked,note:$('note').value};if(!confirm('確認儲存 '+p.month+' '+p.property+'／'+p.type+' 的收款資料？'))return;busy=true;$('save').disabled=true;status('正在儲存…');google.script.run.withSuccessHandler(()=>{status('儲存成功');loadRows()}).withFailureHandler(fail).saveRent(p)});loadMonths();</script></body></html>
