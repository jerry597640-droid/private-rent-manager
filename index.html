<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18343a"><title>每月收租管理｜私人工作台</title>
<style>
:root{color-scheme:light;--ink:#18343a;--muted:#647b7d;--accent:#176b60;--line:#dbe5df}*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:var(--ink);font-family:system-ui,-apple-system,"Microsoft JhengHei","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased}a{-webkit-tap-highlight-color:transparent}a:focus-visible{outline:3px solid #73ad9d;outline-offset:5px}svg{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.shell{max-width:1120px;margin:auto;padding:30px 32px 24px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:17px}.brandmark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--ink);color:white}.brandmark svg{width:23px;height:23px}.privacy{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.privacy svg{width:15px;height:15px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:70px;align-items:center;padding:80px 8px 70px}.eyebrow{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:2px;margin:0 0 19px}.hero h1{font-size:clamp(36px,5vw,56px);letter-spacing:-.035em;line-height:1.25;font-weight:750;margin:0 0 24px}.hero h1 span{color:var(--accent)}.lead{font-size:16px;line-height:1.9;color:var(--muted);max-width:385px;margin:0 0 32px}.primary{display:inline-flex;align-items:center;justify-content:space-between;gap:48px;background:var(--accent);color:white;border:1px solid var(--accent);border-radius:13px;padding:18px 23px;font-size:16px;font-weight:650;text-decoration:none;box-shadow:0 8px 20px #176b6017;transition:background .15s,transform .15s}.primary svg{width:20px;height:20px}.primary:hover{background:#11594f;transform:translateY(-1px)}.signin{font-size:12px;color:var(--muted);line-height:1.8;margin:13px 0 0}
.illustration{position:relative;min-height:360px;display:grid;place-items:center}.circle{position:absolute;width:300px;height:300px;border-radius:50%;background:#e0ebe3;top:22px;left:50%;transform:translateX(-50%)}.building{position:relative;width:235px;height:268px;color:var(--ink);z-index:1}.building svg{width:100%;height:100%;stroke-width:1.5}.illustration-label{position:absolute;left:3px;bottom:48px;z-index:2;background:white;border:1px solid var(--line);border-radius:13px;padding:14px 20px;box-shadow:0 12px 35px #173f3210;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:650}.check{background:#e6f3e9;color:var(--accent);height:30px;width:30px;border-radius:50%;display:grid;place-items:center}.check svg{height:17px;width:17px}.private-note{position:absolute;right:4px;top:48px;z-index:2;background:var(--ink);color:white;border-radius:12px;padding:12px 16px;font-size:11px;letter-spacing:1px;box-shadow:0 10px 26px #18343a18}.dot{width:6px;height:6px;background:#a0d5b8;display:inline-block;margin-right:8px;border-radius:50%}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:19px;background:white;padding:27px 8px}.feature{padding:0 27px;display:flex;gap:16px}.feature+.feature{border-left:1px solid var(--line)}.feature-icon{background:#f0f5f1;color:var(--accent);width:40px;height:40px;border-radius:11px;flex-shrink:0;display:grid;place-items:center}.feature-icon svg{height:21px;width:21px}.feature h2{font-size:15px;margin:2px 0 8px;font-weight:650}.feature p{font-size:12px;line-height:1.8;color:var(--muted);margin:0}.bottom-note{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:27px 4px 0;color:var(--muted);font-size:11px;line-height:1.8}.bottom-note strong{color:var(--ink);font-weight:500}
@media(max-width:760px){.shell{padding:24px 23px 22px}.brand{font-size:15px;gap:9px}.brandmark{width:35px;height:35px;border-radius:10px}.privacy{font-size:10px}.privacy svg{width:13px}.hero{display:flex;flex-direction:column;gap:18px;padding:48px 0 34px;align-items:stretch}.eyebrow{margin-bottom:16px;font-size:10px}.hero h1{font-size:39px;margin-bottom:19px;line-height:1.3}.lead{font-size:14px;margin-bottom:25px;max-width:330px;line-height:1.9}.primary{display:flex;width:100%;padding:17px 21px;font-size:15px}.signin{font-size:11px;text-align:center}.illustration{min-height:230px;margin-top:11px}.circle{height:215px;width:215px;top:4px}.building{width:170px;height:202px}.private-note{right:2px;top:25px;font-size:9px;padding:10px 12px}.illustration-label{left:0;bottom:10px;font-size:11px;padding:10px 13px}.features{grid-template-columns:1fr;padding:5px 20px;border-radius:16px}.feature{padding:20px 0;gap:15px}.feature+.feature{border-left:0;border-top:1px solid var(--line)}.feature h2{font-size:14px;margin-bottom:4px}.feature p{font-size:12px}.bottom-note{flex-direction:column;gap:12px;text-align:center;padding-top:24px}.bottom-note .signature{font-size:10px;letter-spacing:.5px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><div class="shell">
<header class="top"><div class="brand"><span class="brandmark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 21V5l8-3v19M12 8l8 3v10M2 21h20M7.5 7v1m0 4v1m0 4v1M16 12v1m0 4v1"/></svg></span>每月收租管理</div><span class="privacy"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>僅限本人存取</span></header>
<main><section class="hero" aria-labelledby="hero-title">
<div><p class="eyebrow">YOUR PRIVATE RENT WORKSPACE</p><h1 id="hero-title">每月收租，<br><span>心裡有數。</span></h1><p class="lead">從收款登錄到戰情室總覽，<br>把每一筆收租，整理得清楚又安心。</p><a class="primary" id="open" href="https://script.google.com/macros/s/AKfycbwUI5vDB_SxaE3T6YgsnGqEZ0fhSqjdd5pevP5nbdejzrR3HPfkz4GlyzFw541BpqrNGA/exec" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer"><span>開啟收租工作台</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></a><p class="signin">使用您授權的 Google 帳號登入，即可開始。</p></div>
<div class="illustration" aria-hidden="true"><div class="circle"></div><span class="private-note"><i class="dot"></i>PRIVATE & PERSONAL</span><div class="building"><svg viewBox="0 0 235 268"><path d="M39 235V64l87-30v201Z" fill="#fff" stroke="#18343a"/><path d="m126 95 65 25v115h-65Z" fill="#d1e3d8"/><path d="M24 236h184M126 35v200M55 70l55-19M55 84v24h18V78M91 71v24l18-6V65M55 127v24h18v-26M91 119v25l18-3v-27M55 170v24h18v-24M91 164v26h18v-27M149 134v20h17v-17M149 171v22h17v-21M88 235v-28h20v28" stroke="#18343a"/><path d="M39 235V64l87-30v201M126 95l65 25v115" stroke-width="2.4"/><path d="M24 236h184" stroke-width="2.4"/></svg></div><div class="illustration-label"><span class="check"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></span>每一筆，都有清楚的紀錄</div></div>
</section>
<section class="features" aria-label="工作台功能">
<div class="feature"><span class="feature-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18M7 15h3m4 0h3"/></svg></span><div><h2>按月份整理</h2><p>切換月份與物件，<br>快速找到要登錄的那一筆。</p></div></div>
<div class="feature"><span class="feature-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13 4H4v17h16v-8M10 14l1-4 7-7 3 3-7 7-4 1Z"/></svg></span><div><h2>手機輕鬆登錄</h2><p>填入金額、日期與備註，<br>確認後即可儲存。</p></div></div>
<div class="feature"><span class="feature-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20h17M6 16v-5m6 5V5m6 11v-8"/></svg></span><div><h2>收租戰情室</h2><p>月份趨勢、逾期與待收，<br>一眼掌握，直接前往登錄。</p></div></div>
</section></main>
<footer class="bottom-note"><span><strong>讓收租更順手</strong>　可將此入口加入手機主畫面。</span><span class="signature">私人資料僅在登入後顯示 · RENT MANAGER</span></footer>
</div></body></html>
